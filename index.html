<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הקרפטים 2026</title>
<meta name="description" content="אפליקציית הטיול המשפחתי לקרפטים הרומניים — 20–29 בספטמבר 2026">
<meta name="theme-color" content="#1c3a33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* ---------- Design tokens: alpine autumn, Carpathian trail blazes ---------- */
:root{
  --mist:#eef1ea;         /* ערפל בוקר — רקע */
  --ink:#22302b;          /* אשוח כהה */
  --pine:#35604a;         /* אורן */
  --pine-deep:#1c3a33;    /* דמדומים */
  --pine-mid:#2e5b4b;
  --blaze-yellow:#e8b21a; /* Banda Galbenă */
  --blaze-red:#c4442a;    /* Punct Roșu */
  --blaze-blue:#2b6cb0;   /* Cruce Albastră */
  --card:#ffffff;
  --line:#d8ded4;
  --muted:#68746c;
  --soft:#e2e8de;
  --amber-soft:#fdf3d7;
  --red-soft:#fbe9e4;
  --radius:18px;
  --shadow:0 1px 2px rgba(34,48,43,.06),0 6px 18px rgba(34,48,43,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Heebo","Noto Sans Hebrew",Arial,sans-serif;
  background:var(--mist);color:var(--ink);line-height:1.55;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
  font-size:16px;
}
button{font-family:inherit}
a{color:var(--pine)}
bdi{unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ---------- Header: ridge banner ---------- */
header{
  background:linear-gradient(160deg,var(--pine-deep) 0%,var(--pine-mid) 70%,#3c6d59 100%);
  color:#fff;position:relative;overflow:hidden;
  padding:calc(14px + env(safe-area-inset-top)) 20px 30px;
}
header .ridge{position:absolute;bottom:-2px;left:0;right:0;width:100%;height:34px;opacity:.9}
header h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
header .sub{font-size:13px;opacity:.85;margin-top:2px}
header .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;z-index:1}
.offline-pill{
  display:none;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.25);
  color:#ffe9b0;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;
}
body.is-offline .offline-pill{display:inline-block}

/* ---------- Layout ---------- */
main{max-width:640px;margin:0 auto;padding:16px 14px 8px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid rgba(216,222,212,.6)}
.card h2{font-size:18px;font-weight:800;letter-spacing:-.2px}
.card h3{font-size:15px;font-weight:800;margin-bottom:4px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.mut{color:var(--muted);font-size:13.5px}
.small{font-size:13px}
hr.dv{border:0;border-top:1px dashed var(--line);margin:12px 0}

/* ---------- Trail blaze (signature element) ----------
   painted white square on rock, colored marking inside */
.blaze{
  width:46px;height:46px;flex:0 0 46px;background:#fff;border-radius:7px;
  box-shadow:0 1px 2px rgba(34,48,43,.18),inset 0 0 0 1px rgba(34,48,43,.07);
  display:flex;align-items:center;justify-content:center;position:relative;
  transform:rotate(-2.5deg);
}
.blaze.alt{transform:rotate(2deg)}
.blaze .stripe{width:100%;height:13px;background:var(--blaze-yellow)}
.blaze .stripe.blue{background:var(--blaze-blue)}
.blaze .dot{width:18px;height:18px;border-radius:50%;background:var(--blaze-red)}
.blaze .cross{position:relative;width:22px;height:22px}
.blaze .cross::before,.blaze .cross::after{content:"";position:absolute;background:var(--blaze-blue);left:50%;top:50%}
.blaze .cross::before{width:22px;height:7px;transform:translate(-50%,-50%)}
.blaze .cross::after{width:7px;height:22px;transform:translate(-50%,-50%)}
.blaze .glyph{font-size:22px;line-height:1}
.blaze .datebig{font-size:17px;font-weight:800;color:var(--ink);line-height:1;direction:ltr}
.blaze.big{width:64px;height:64px;flex-basis:64px;border-radius:9px}
.blaze.big .glyph{font-size:30px}
.blaze.big .datebig{font-size:23px}

/* mini blaze tag for route options */
.mark-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.mark-tag i{display:inline-block;width:14px;height:14px;border-radius:3px;background:#fff;box-shadow:inset 0 0 0 1px rgba(34,48,43,.15);position:relative}
.mark-tag i::after{content:"";position:absolute;inset:0;margin:auto}
.mark-tag i.yellow::after{width:14px;height:5px;background:var(--blaze-yellow)}
.mark-tag i.red::after{width:7px;height:7px;border-radius:50%;background:var(--blaze-red)}
.mark-tag i.blue::after{width:14px;height:5px;background:var(--blaze-blue)}

/* ---------- Timeline ---------- */
.tl{position:relative;padding-right:22px}
.tl::before{content:"";position:absolute;right:22px;top:10px;bottom:10px;border-right:2px dashed #b9c4b6}
.day-row{position:relative;display:flex;gap:12px;margin-bottom:14px;margin-right:-22px}
.day-row .blaze{margin-top:8px;z-index:1}
.day-card{flex:1;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(216,222,212,.6);overflow:hidden}
.day-head{width:100%;background:none;border:0;text-align:right;padding:13px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.day-head .t{font-size:15.5px;font-weight:800}
.day-head .d{font-size:12.5px;color:var(--muted);margin-top:1px}
.day-head .chev{color:var(--muted);transition:transform .2s;flex:0 0 auto}
.day-card.open .chev{transform:rotate(180deg)}
.day-body{display:none;padding:0 15px 15px;border-top:1px dashed var(--line)}
.day-card.open .day-body{display:block}
.day-body>*:first-child{margin-top:12px}
.today-flag{font-size:11px;font-weight:800;background:var(--blaze-yellow);color:#3d2f05;border-radius:6px;padding:2px 7px;white-space:nowrap}

/* ---------- Chips & stats ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--soft);color:var(--ink);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700}
.chip.warn{background:var(--amber-soft);color:#7a5a08}
.chip.alert{background:var(--red-soft);color:#8c2d18}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--pine);color:#fff;border:0;border-radius:12px;
  padding:10px 15px;font-size:14.5px;font-weight:700;cursor:pointer;text-decoration:none;
  min-height:44px;
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--pine);border:1.5px solid var(--pine)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--blaze-red)}
.btn.wide{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn-row .btn{flex:1 1 auto}
.copy-line{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--mist);border:1px solid var(--line);border-radius:12px;
  padding:9px 12px;margin-top:8px;
}
.copy-line .lbl{font-size:12px;color:var(--muted);font-weight:700}
.copy-line .val{font-weight:800;font-size:15.5px;direction:ltr;unicode-bidi:isolate}
.copy-line button{
  background:var(--pine);color:#fff;border:0;border-radius:9px;padding:7px 12px;
  font-size:13px;font-weight:700;cursor:pointer;flex:0 0 auto;min-height:36px;
}

/* ---------- Transport rows ---------- */
.tr-row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}
.tr-row:last-child{border-bottom:0}
.tr-row .tm{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap;min-width:86px;text-align:left}
.tr-row .tx{flex:1;font-size:14.5px}

/* ---------- Route options ---------- */
.opt{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.opt.hard{border-color:#eccfc5;background:#fffbfa}
.opt.easy{border-color:#e4d9ae;background:#fffdf4}
.opt .opt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.opt .opt-head b{font-size:14.5px}

/* ---------- Notices ---------- */
.notice{border-radius:14px;padding:11px 13px;font-size:14px;margin-top:10px;display:flex;gap:9px;align-items:flex-start}
.notice.warn{background:var(--amber-soft);border:1px solid #efd993}
.notice.alert{background:var(--red-soft);border:1px solid #f2c4b6}
.notice.info{background:#e7eef5;border:1px solid #c9d9e8}
.notice .ic{flex:0 0 auto;font-size:16px;line-height:1.5}

/* ---------- Today hero ---------- */
.hero{
  background:linear-gradient(165deg,#fff 0%,#f7f9f4 100%);
  border-radius:22px;box-shadow:var(--shadow);border:1px solid rgba(216,222,212,.7);
  padding:18px 16px;margin-bottom:14px;
}
.hero .hh{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.hero .hh .tt{flex:1}
.hero .hh .tt .t1{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.hero .hh .tt .t2{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.countdown{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.countdown .n{font-size:52px;font-weight:800;letter-spacing:-2px;color:var(--pine-deep);font-variant-numeric:tabular-nums}
.countdown .l{font-size:16px;font-weight:700;color:var(--muted)}
.next-strip{background:var(--soft);border-radius:12px;padding:9px 12px;font-size:13.5px;margin-top:12px}
.next-strip b{font-weight:800}

/* ---------- Checklist ---------- */
.gear-group{margin-bottom:4px}
.gear-item{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px dashed var(--line);cursor:pointer;user-select:none}
.gear-item:last-child{border-bottom:0}
.gear-item .box{
  width:24px;height:24px;flex:0 0 24px;border-radius:7px;border:2px solid #a9b5a8;background:#fff;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;
}
.gear-item.done .box{background:var(--pine);border-color:var(--pine)}
.gear-item.done .tx{color:var(--muted);text-decoration:line-through}
.gear-item .tx{flex:1;font-size:15px}
.gear-item .rm{border:0;background:none;color:#b46a5a;font-size:17px;padding:4px 6px;cursor:pointer}
.progress{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--pine),#5c8f74);border-radius:999px;transition:width .25s}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{
  flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;
  font-family:inherit;background:#fff;min-width:0;
}
.add-row input:focus{outline:2px solid var(--pine);outline-offset:1px;border-color:var(--pine)}

/* ---------- Emergency ---------- */
.sos{
  display:flex;align-items:center;justify-content:center;gap:12px;background:var(--blaze-red);color:#fff;
  border-radius:18px;padding:18px;text-decoration:none;box-shadow:var(--shadow);margin-bottom:14px;
}
.sos .n{font-size:36px;font-weight:800;letter-spacing:1px}
.sos .t{font-size:14px;font-weight:700;line-height:1.35}

/* ---------- Bottom nav ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav a{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;
  padding:5px 2px;border-radius:10px;position:relative;
}
nav a svg{width:23px;height:23px}
nav a.active{color:var(--pine-deep)}
nav a.active::before{content:"";position:absolute;top:-7px;width:26px;height:4px;border-radius:0 0 4px 4px;background:var(--blaze-yellow)}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:700;
  opacity:0;pointer-events:none;transition:all .25s;z-index:99;white-space:nowrap;box-shadow:0 6px 22px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .act{color:var(--blaze-yellow);margin-inline-start:12px;cursor:pointer;pointer-events:auto;text-decoration:underline}

.tab-pane{animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
</style>
</head>

const $view = document.getElementById("view");
const $toast = document.getElementById("toast");

/* ---------- utils ---------- */
function todayISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dayIndexFor(iso){ return DAYS.findIndex(d => d.date === iso); }
function daysUntilStart(){
  const ms = new Date(TRIP.start + "T00:00:00") - new Date(todayISO() + "T00:00:00");
  return Math.round(ms / 86400000);
}
let toastTimer = null;
function toast(msg, actLbl, actFn){
  $toast.innerHTML = msg + (actLbl ? ' <span class="act" id="toast-act">' + actLbl + "</span>" : "");
  if (actLbl && actFn) document.getElementById("toast-act").onclick = actFn;
  $toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove("show"), actLbl ? 8000 : 2200);
}
function copyText(t){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast("הועתק ✓")).catch(()=>legacyCopy(t));
  } else legacyCopy(t);
}
function legacyCopy(t){
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("הועתק ✓"); } catch(e){ toast("לא הצלחתי להעתיק"); }
  document.body.removeChild(ta);
}
function mapsUrl(addr){ return "https://maps.google.com/?q=" + encodeURIComponent(addr); }

/* ---------- blaze renderer ---------- */
function blazeHTML(b, big, dateLbl){
  const cls = "blaze" + (big ? " big" : "") + (b && b.alt ? " alt" : "");
  let inner = "";
  if (dateLbl) inner = '<span class="datebig">' + dateLbl + "</span>";
  else if (b && b.stripe) inner = '<span class="stripe' + (b.stripe === "blue" ? " blue" : "") + '"></span>';
  else if (b && b.dot) inner = '<span class="dot"></span>';
  else if (b && b.cross) inner = '<span class="cross"></span>';
  else if (b && b.glyph) inner = '<span class="glyph">' + b.glyph + "</span>";
  return '<div class="' + cls + '">' + inner + "</div>";
}
function markTag(color, lbl){
  return '<span class="mark-tag"><i class="' + color + '"></i>' + lbl + "</span>";
}

/* ---------- block renderers ---------- */
function renderBlocks(blocks){
  return blocks.map(b => {
    if (b.t === "text") return '<p style="margin-top:10px">' + b.p + "</p>";

      return '<div style="margin-top:8px">' + b.items.map(i =>
        '<div class="tr-row"><span class="tm">' + i.tm + '</span><span class="tx">' + i.tx + "</span></div>"
      ).join("") + "</div>";
    }
    if (b.t === "links"){
      return '<div class="btn-row">' + b.items.map(l =>
        '<a class="btn ghost" href="' + l.url + '" target="_blank" rel="noopener">' + l.lbl + "</a>"
      ).join("") + "</div>";
    }
    if (b.t === "hike"){
      let h = "";
      if (b.stats) h += '<div class="chips">' + b.stats.map(s => '<span class="chip">' + s + "</span>").join("") + "</div>";
      h += "<p>" + b.p + "</p>";
      if (b.mapy) h += '<div class="btn-row"><a class="btn wide" href="' + b.mapy + '" target="_blank" rel="noopener">🗺️ פתיחת המסלול ב-Mapy</a></div>';
      if (b.videos) h += '<div class="btn-row">' + b.videos.map(v => '<a class="btn ghost" href="' + v.url + '" target="_blank" rel="noopener">' + v.lbl + "</a>").join("") + "</div>";

        return oh + "</div>";
      }).join("");
      return h;
    }
    if (b.t === "stay"){

      let h = '<div class="notice info" style="align-items:center"><span class="ic">' + s.icon + '</span><span><b>לינה: ' + s.name + "</b>";
      if (s.open) h += '<br><span class="small" style="color:#8c2d18">⚠️ ' + s.open + "</span>";
      h += ' · <a href="#bookings" onclick="location.hash=\'bookings\'">לפרטי ההזמנה</a></span></div>';
      return h;
    }
    return "";
  }).join("");
}

/* ---------- TODAY tab ---------- */
function renderToday(){
  const iso = todayISO();
  const idx = dayIndexFor(iso);
  let h = "";

  if (idx === -1 && iso < TRIP.start){
    const n = daysUntilStart();
    h += '<div class="hero">'
      + '<div class="eyebrow">ספירה לאחור</div>'
      + '<div class="countdown"><span class="n">' + n + '</span><span class="l">ימים ליציאה 🇷🇴</span></div>'
      + '<p class="mut">יום ראשון, 20.9 · המראה 11:10 מנתב״ג · HiSky <bdi>H4236</bdi></p>'
      + '<div class="btn-row"><a class="btn" href="#route">📋 לתוכנית המלאה</a><a class="btn ghost" href="#gear">🎒 לצ׳קליסט הציוד</a></div>'
      + "</div>";
    h += '<div class="card"><div class="eyebrow">משימות פתוחות</div>'
      + OPEN_ITEMS.map(o => '<div class="tr-row"><span class="tx">' + o + "</span></div>").join("")
      + "</div>";
    h += '<div class="notice info"><span class="ic">📲</span><span>טיפ: כל אחד מהמשתתפים מוריד מראש את מפת רומניה האופליין באפליקציית <b>Mapy</b> — הניווט בשטח עובר דרכה.</span></div>';
  }
  else if (idx === -1 && iso > TRIP.end){
    h += '<div class="hero"><div class="hh">' + blazeHTML({glyph:"🏔️"}, true)
      + '<div class="tt"><div class="t1">הטיול הסתיים</div><div class="t2">איזה טרק זה היה! 5 ימי הרים, 2 רכסים, המון צ׳ורבה 🥣</div></div></div>'
      + '<div class="btn-row"><a class="btn ghost" href="#route">📖 לעבור שוב על המסלול</a></div></div>';
  }
  else {
    const d = DAYS[idx];
    h += '<div class="hero">'
      + '<div class="hh">' + blazeHTML(d.blaze, true, null)
      + '<div class="tt"><div class="t1">יום ' + (idx+1) + " מתוך 10 · " + d.dow + " " + d.dnum + '</div><div class="t2">' + d.title + "</div></div></div>"
      + '<div class="chips"><span class="chip warn">' + d.tag + "</span></div>"
      + renderBlocks(d.blocks)
      + "</div>";
    if (idx + 1 < DAYS.length){
      const nx = DAYS[idx+1];
      h += '<a class="next-strip" style="display:block;text-decoration:none;color:inherit" href="#route">מחר · ' + nx.dow + " " + nx.dnum + ": <b>" + nx.title + "</b> ←</a>";
    }
  }
  return '<div class="tab-pane">' + h + "</div>";
}

/* ---------- ROUTE tab (timeline) ---------- */
function renderRoute(){
  const iso = todayISO();
  let h = '<div class="tab-pane"><div class="tl">';
  DAYS.forEach((d, i) => {
    const isToday = d.date === iso;
    h += '<div class="day-row">'
      + blazeHTML(d.blaze, false, null)
      + '<div class="day-card' + (isToday ? " open" : "") + '" id="dc' + i + '">'
      + '<button class="day-head" onclick="toggleDay(' + i + ')" aria-expanded="' + (isToday ? "true" : "false") + '">'
      + '<span><span class="t">' + d.title + (isToday ? ' <span class="today-flag">היום</span>' : "") + '</span><br><span class="d">' + d.dow + " · " + d.dnum + " · " + d.tag + "</span></span>"
      + '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>'
      + "</button>"
      + '<div class="day-body">' + renderBlocks(d.blocks) + "</div>"
      + "</div></div>";
  });
  h += "</div></div>";
  return h;
}
function toggleDay(i){
  const el = document.getElementById("dc" + i);
  el.classList.toggle("open");
  el.querySelector(".day-head").setAttribute("aria-expanded", el.classList.contains("open"));
}

/* ---------- BOOKINGS tab ---------- */
function stayCard(s){
  let h = '<div class="card"><div style="display:flex;gap:10px;align-items:flex-start">'
    + '<span style="font-size:26px">' + s.icon + '</span><div style="flex:1">'
    + "<h3>" + s.name + "</h3>"
    + '<div class="mut">' + s.nights + "</div></div></div>";
  (s.refs || []).forEach(r => {
    h += '<div class="copy-line"><span><span class="lbl">' + r.lbl + '</span><br><span class="val">' + r.val + "</span></span>"
      + '<button onclick="copyText(\'' + r.val + '\')">העתקה</button></div>';
  });
  if (s.phone){
    h += '<div class="copy-line"><span><span class="lbl">טלפון (הזמנות במזומן, טלפונית)</span><br><span class="val">' + s.phone + "</span></span>"
      + '<button onclick="copyText(\'' + s.phone + '\')">העתקה</button></div>';
    h += '<div class="btn-row"><a class="btn" href="tel:' + s.phone + '">📞 חיוג לבקתה</a>'
      + '<a class="btn ghost" href="mailto:' + s.email + '">✉️ אימייל</a></div>';
  }
  if (s.notes && s.notes.length) h += '<hr class="dv">' + s.notes.map(n => '<p class="small" style="margin-top:4px">· ' + n + "</p>").join("");
  if (s.open) h += '<div class="notice alert"><span class="ic">⚠️</span><span>' + s.open + "</span></div>";
  const btns = [];
  if (s.address && s.address.indexOf(",") > -1) btns.push('<a class="btn soft" href="' + mapsUrl(s.address) + '" target="_blank" rel="noopener">📍 ניווט לכתובת</a>');
  if (s.link) btns.push('<a class="btn soft" href="' + s.link.url + '" target="_blank" rel="noopener">🔗 ' + s.link.lbl + "</a>");
  if (btns.length) h += '<div class="btn-row">' + btns.join("") + "</div>";
  if (s.address) h += '<p class="mut small" style="margin-top:8px;direction:ltr;text-align:left">' + s.address + "</p>";
  return h + "</div>";
}
function renderBookings(){
  let h = '<div class="tab-pane">';
  h += '<div class="card"><div class="eyebrow">טיסות</div>'
    + '<div class="tr-row"><span class="tm">20.9</span><span class="tx">ת״א → בוקרשט · המראה <b class="num">11:10</b> נחיתה <b class="num">13:40</b> · HiSky <bdi>H4236</bdi> · A320</span></div>'
    + '<div class="tr-row"><span class="tm">29.9</span><span class="tx">בוקרשט → ת״א · המראה <b class="num">17:55</b> נחיתה <b class="num">20:40</b> · Anima Wings <bdi>A2700</bdi> · A220-300</span></div>'
    + '<div class="notice warn"><span class="ic">🎒</span><span>בשתי הטיסות: אין ארוחות ואין כבודה רשומה בחינם.</span></div>'
    + '<div class="copy-line"><span><span class="lbl">שאטל שדה→מלון (חינם)</span><br><span class="val">389503655</span></span><button onclick="copyText(\'389503655\')">העתקה</button></div>'
    + "</div>";
  h += '<div class="card"><div class="eyebrow">רכבות · 22.9</div>'
    + '<div class="tr-row"><span class="tm">06:35–09:01</span><span class="tx">בוקרשט נורד → ברשוב · <bdi>ATC IR 11531</bdi></span></div>'
    + '<div class="tr-row"><span class="tm">09:10–09:51</span><span class="tx">ברשוב → זרנשט · <bdi>RC R 11237</bdi> · החלפה של 9 דק׳ בלבד!</span></div>'
    + '<p class="mut small" style="margin-top:8px">כ-54 ₪ למבוגר · חזור 29.9: בושטני → בוקרשט — שעות טרם נקבעו ⚠️</p>'
    + "</div>";
  ["orhideea","maricom","curmatura","rareforest","malaiesti","busteni"].forEach(k => { h += stayCard(STAYS[k]); });
  h += "</div>";
  return h;
}

/* ---------- GEAR tab ---------- */
const LS_CHECKS = "gear-checks-v1", LS_CUSTOM = "gear-custom-v1";
function loadJSON(k, fb){ try { return JSON.parse(localStorage.getItem(k)) || fb; } catch(e){ return fb; } }
function saveJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function gearAll(){
  const custom = loadJSON(LS_CUSTOM, []);
  const groups = GEAR.map((g, gi) => ({ g: g.g, items: g.items.map((tx, ii) => ({ id: "g" + gi + "i" + ii, tx })) }));
  if (custom.length) groups.push({ g: "פריטים שהוספתם", items: custom.map((tx, i) => ({ id: "c" + i, tx, custom: true, ci: i })) });
  return groups;
}
function renderGear(){
  const checks = loadJSON(LS_CHECKS, {});
  const groups = gearAll();
  let total = 0, done = 0;
  groups.forEach(g => g.items.forEach(it => { total++; if (checks[it.id]) done++; }));
  const pct = total ? Math.round(done / total * 100) : 0;

  let h = '<div class="tab-pane">';
  h += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2>צ׳קליסט ציוד 🎒</h2>'
    + '<span class="mut"><b>' + done + "</b>/" + total + "</span></div>"
    + '<div class="progress"><i style="width:' + pct + '%"></i></div>'
    + '<p class="mut small">הרשימה אישית ונשמרת במכשיר הזה בלבד.</p></div>';

  groups.forEach(g => {
    h += '<div class="card gear-group"><div class="eyebrow">' + g.g + "</div>";
    g.items.forEach(it => {
      const on = !!checks[it.id];
      h += '<div class="gear-item' + (on ? " done" : "") + '" onclick="toggleGear(\'' + it.id + '\')" role="checkbox" aria-checked="' + on + '" tabindex="0" onkeydown="if(event.key===\' \'||event.key===\'Enter\'){event.preventDefault();toggleGear(\'' + it.id + '\')}">'
        + '<span class="box">' + (on ? "✓" : "") + "</span>"
        + '<span class="tx">' + it.tx + "</span>"
        + (it.custom ? '<button class="rm" onclick="event.stopPropagation();removeCustom(' + it.ci + ')" aria-label="הסרה">✕</button>' : "")
        + "</div>";
    });
    h += "</div>";
  });

  h += '<div class="card"><div class="eyebrow">הוספת פריט</div>'
    + '<div class="add-row"><input id="new-gear" type="text" placeholder="למשל: מטען נייד נוסף" onkeydown="if(event.key===\'Enter\')addGear()">'
    + '<button class="btn" onclick="addGear()">הוספה</button></div>'
    + '<div class="btn-row"><button class="btn soft wide" onclick="resetGear()">איפוס כל הסימונים</button></div>'
    + "</div></div>";
  return h;
}
function toggleGear(id){
  const checks = loadJSON(LS_CHECKS, {});
  checks[id] = !checks[id];
  saveJSON(LS_CHECKS, checks);
  render();
}
function addGear(){
  const inp = document.getElementById("new-gear");
  const v = (inp.value || "").trim();
  if (!v) return;
  const custom = loadJSON(LS_CUSTOM, []);
  custom.push(v);
  saveJSON(LS_CUSTOM, custom);
  render();
  toast("נוסף לרשימה ✓");
}
function removeCustom(i){
  const custom = loadJSON(LS_CUSTOM, []);
  custom.splice(i, 1);
  saveJSON(LS_CUSTOM, custom);
  render();
}
function resetGear(){
  if (confirm("לאפס את כל הסימונים ברשימה?")){
    saveJSON(LS_CHECKS, {});
    render();
  }
}

/* ---------- SOS tab ---------- */
function renderSOS(){
  let h = '<div class="tab-pane">';
  h += '<a class="sos" href="tel:112"><span class="n num">112</span><span class="t">חירום ברומניה<br>לבקש <b>Salvamont</b> — יחידת חילוץ ההרים</span></a>';
  h += '<div class="card"><div class="eyebrow">כדאי לדעת</div>'
    + '<p class="small" style="margin-top:6px">· כיסוי סלולרי קיים ברוב הרכסים, חלקי בעמקים. אם אין קליטה — לנוע לנקודה גבוהה.</p>'
    + '<p class="small" style="margin-top:6px">· ביום הרכס (24.9): פירים וחללים קארסטיים עמוקים באזור מחסה Grind — להישאר על השביל המסומן.</p>'
    + '<p class="small" style="margin-top:6px">· משפט שימושי: <b>«fără porc»</b> = בלי חזיר.</p>'
    + "</div>";
  h += '<div class="notice alert"><span class="ic">❗</span><span><b>ביטוח נסיעות עדיין לא נסגר.</b> לסגור לפני היציאה ולעדכן כאן את פרטי הפוליסה והטלפון של חברת הביטוח.</span></div>';
  h += '<div class="card"><div class="eyebrow">טלפונים</div>'
    + '<div class="copy-line"><span><span class="lbl">Cabana Mălăiești</span><br><span class="val">+40741074884</span></span><button onclick="copyText(\'+40741074884\')">העתקה</button></div>'
    + '<div class="btn-row"><a class="btn" href="tel:+40741074884">📞 חיוג לבקתת מליישט</a></div>'
    + "</div>";
  h += '<div class="card"><div class="eyebrow">כתובות הלינה</div>'
    + ["orhideea","maricom","rareforest"].map(k => {
        const s = STAYS[k];
        return '<div class="tr-row"><span class="tx"><b>' + s.name + '</b><br><span class="mut small" style="direction:ltr;unicode-bidi:isolate;display:inline-block">' + s.address + "</span></span></div>";
      }).join("")
    + "</div></div>";
  return h;
}

/* ---------- Router ---------- */
const TABS = { today: renderToday, route: renderRoute, bookings: renderBookings, gear: renderGear, sos: renderSOS };
function currentTab(){
  const t = (location.hash || "#today").slice(1);
  return TABS[t] ? t : "today";
}
function render(){
  const t = currentTab();
  $view.innerHTML = TABS[t]();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.tab === t));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

/* ---------- Offline & SW ---------- */
function syncOnline(){ document.body.classList.toggle("is-offline", !navigator.onLine); }
window.addEventListener("online", syncOnline);
window.addEventListener("offline", syncOnline);
syncOnline();

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller){
            toast("יש גרסה חדשה של האפליקציה", "רענון", () => location.reload());
          }
        });
      });
    }).catch(()=>{ /* לא קריטי — האפליקציה עובדת גם בלי */ });
  });
}

render();
</script>
